<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartDocs AI</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
          background: #0f0f0f;
          color: #e5e5e5;
          height: 100vh;
          display: flex;
          flex-direction: column;
        }

        /* Header */
        .header {
          background: #151515;
          border-bottom: 1px solid #2a2a2a;
          padding: 14px 24px;
        }
        .logo {
          width: 36px; height: 36px;
          background: #1D9E75;
          border-radius: 10px;
          display: flex; align-items: center; justify-content: center;
          font-size: 16px; font-weight: 700; color: #fff;
        }
        .header-title { font-size: 16px; font-weight: 600; color: #fff; }
        .header-sub   { font-size: 12px; color: #888; }

        /* Messages */
        #messages {
          flex: 1;
          overflow-y: auto;
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }

        .msg       { display: flex; gap: 12px; align-items: flex-start; }
        .msg.user  { flex-direction: row-reverse; }

        .avatar {
          width: 34px; height: 34px;
          border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 13px; font-weight: 600;
          flex-shrink: 0;
        }
        .avatar.ai   { background: #1D9E75; color: #fff; }
        .avatar.user { background: #2a2a2a; color: #aaa; border: 1px solid #333; }

        .bubble {
          max-width: 75%;
          padding: 12px 16px;
          font-size: 14px;
          line-height: 1.7;
          border-radius: 16px;
        }
        .bubble.ai {
          background: #222222;
          border: 1px solid #333333;
          border-radius: 4px 16px 16px 16px;
          color: #e5e5e5;
        }
        .bubble.user {
          background: #1D9E75;
          color: #fff;
          border-radius: 16px 4px 16px 16px;
        }

        .source {
          font-size: 11px;
          color: #666;
          margin-top: 8px;
          padding-top: 8px;
          border-top: 1px solid #2a2a2a;
        }

        /* Typing dots */
        .typing { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
        .dot {
          width: 7px; height: 7px;
          border-radius: 50%;
          background: #1D9E75;    /* ← green, visible on dark */
          animation: bounce 1s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-6px); }
        }

        /* Input */
        .input-area {
          background: #151515;
          border-top: 1px solid #2a2a2a;
          padding: 16px 24px;
        }
        #input {
          background: #1a1a1a;
          border: 1px solid #2a2a2a;
          color: #e5e5e5;
          border-radius: 12px;
          font-size: 14px;
          resize: none;
        }
        #input:focus {
          background: #1a1a1a;
          border-color: #1D9E75;
          color: #e5e5e5;
          box-shadow: 0 0 0 2px rgba(29,158,117,0.2);
        }
        #input::placeholder { color: #555; }

        #sendBtn {
          background: #1D9E75;
          border: none;
          border-radius: 12px;
          width: 46px; height: 46px;
          font-size: 18px;
          transition: background 0.2s;
        }
        #sendBtn:hover    { background: #17a868; }
        #sendBtn:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header d-flex align-items-center gap-3">
        <div class="logo">S</div>
        <div>
            <div class="header-title">SmartDocs AI</div>
            <div class="header-sub">Ask anything from your documents</div>
        </div>
    </div>

    <!-- Messages -->
    <div id="messages">
        <div class="msg">
            <div class="avatar ai">S</div>
            <div class="bubble ai">
                Hi! I'm SmartDocs AI. Ask me anything about your uploaded documents.
            </div>
        </div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="d-flex gap-2 align-items-end">
            <textarea id="input" class="form-control" rows="1" placeholder="Ask a question about your documents..."></textarea>
            <button class="btn text-white" id="sendBtn">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
        <div class="text-center mt-2">
            <small class="text-secondary">Press Enter to send · Shift+Enter for new line</small>
        </div>
    </div>

    <!-- jQuery + Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {

          // Send on Enter key
          $('#input').on('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });

          // Send button click
          $('#sendBtn').on('click', function () {
            sendMessage();
          });

          function addMessage(role, text, source = null) {
            const avatarLabel = role === 'ai' ? 'S' : 'U';
            const sourceHtml  = source
              ? `<div class="source"><i class="bi bi-file-earmark-text"></i> ${source}</div>`
              : '';

            const html = `
              <div class="msg ${role}">
                <div class="avatar ${role}">${avatarLabel}</div>
                <div class="bubble ${role} bubble-content">
                  ${text}${sourceHtml}
                </div>
              </div>`;

            $('#messages').append(html);
            scrollBottom();

            // Return the last bubble for streaming into
            return $('#messages .bubble-content').last();
          }

          function addTyping() {
            const html = `
              <div class="msg" id="typing">
                <div class="avatar ai">S</div>
                <div class="bubble ai" style="background:#222;border:1px solid #333;min-width:70px">
                  <div class="typing" style="display:flex;gap:6px;align-items:center;height:20px">
                    <div style="width:8px;height:8px;border-radius:50%;background:#1D9E75;animation:bounce 1s infinite 0s"></div>
                    <div style="width:8px;height:8px;border-radius:50%;background:#1D9E75;animation:bounce 1s infinite 0.2s"></div>
                    <div style="width:8px;height:8px;border-radius:50%;background:#1D9E75;animation:bounce 1s infinite 0.4s"></div>
                  </div>
                </div>
              </div>`;
            $('#messages').append(html);
            scrollBottom();
          }

          function removeTyping() {
            $('#typing').remove();
          }

          function scrollBottom() {
            const el = document.getElementById('messages');
            el.scrollTop = el.scrollHeight;
          }

          async function sendMessage() {
            const question = $('#input').val().trim();
            if (!question) return;

            // Show user message
            addMessage('user', question);
            $('#input').val('');
            $('#sendBtn').prop('disabled', true);

            // Show typing indicator
            addTyping();

            try {
              const response = await fetch('http://localhost:8000/ask-stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
              });

              removeTyping();

              // Create empty AI bubble to stream into
              const bubble = addMessage('ai', '');
              const reader  = response.body.getReader();
              const decoder = new TextDecoder();
              let fullText  = '';

              // Read stream chunk by chunk
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                fullText += decoder.decode(value);
                bubble.text(fullText);
                scrollBottom();
              }

            } catch (error) {
              removeTyping();
              addMessage('ai', 'Sorry — something went wrong. Is the server running on port 8000?');
            }

            $('#sendBtn').prop('disabled', false);
            $('#input').focus();
          }

        });
    </script>
</body>
</html>
